<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BJJ TUFF</title>
<style>
  html, body { height: 100%; margin: 0; background: #0A0A0A; overflow: hidden; }
  body { display: grid; place-items: center; }

  .logo {
    position: relative;
    width: min(70vw, 720px);
    aspect-ratio: 800 / 606;
    transform-origin: 50% 50%;
    animation: settle 1200ms cubic-bezier(0.16, 1, 0.3, 1) 1700ms forwards;
  }
  @keyframes settle {
    from { transform: scale(1); }
    to   { transform: scale(1.02); }
  }

  /* Both halves are full-master-size canvases (transparent padding around the content),
     so they share the parent's coordinate system and scale identically. */
  .piece {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    user-select: none;
    -webkit-user-drag: none;
    will-change: transform, opacity, filter;
  }

  .bjj {
    transform: translateY(-130vh) rotate(-2deg);
    opacity: 0;
    filter: blur(6px);
    animation: bjjSlam 900ms cubic-bezier(0.55, 0, 0.2, 1) 350ms forwards;
  }
  @keyframes bjjSlam {
    0%   { transform: translateY(-130vh) rotate(-2deg); opacity: 0; filter: blur(6px); }
    70%  { opacity: 1; filter: blur(0); }
    85%  { transform: translateY(14px) rotate(0.6deg); }
    100% { transform: translateY(0) rotate(0); opacity: 1; filter: blur(0); }
  }

  .tuff {
    transform: translateX(140vw) rotate(8deg) scale(1.05);
    opacity: 0;
    filter: blur(4px);
    animation: tuffWhip 850ms cubic-bezier(0.18, 0.9, 0.25, 1.15) 1100ms forwards;
  }
  @keyframes tuffWhip {
    0%   { transform: translateX(140vw) rotate(8deg) scale(1.05); opacity: 0; filter: blur(4px); }
    60%  { opacity: 1; filter: blur(0); }
    80%  { transform: translateX(-12px) rotate(-1.5deg) scale(1.02); }
    100% { transform: translateX(0) rotate(0) scale(1); opacity: 1; filter: blur(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo { animation: none; }
    .bjj  { animation: none; transform: none; opacity: 1; filter: none; }
    .tuff { animation: none; transform: none; opacity: 1; filter: none; }
  }
</style>
</head>
<body>
  <div class="logo">
    <img class="piece bjj"  src="wordmark-bjj.png"  alt="BJJ"  draggable="false" />
    <img class="piece tuff" src="wordmark-tuff.png" alt="TUFF" draggable="false" />
  </div>
</body>
</html>
