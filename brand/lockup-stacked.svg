<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280" role="img" aria-label="BJJ Tuff">
  <title>BJJ Tuff — stacked badge lockup (mark above wordmark)</title>

  <!-- Square mark -->
  <rect width="200" height="200" fill="#E63946"/>
  <g font-family="Anton, Impact, 'Arial Narrow Bold', 'Helvetica Condensed Bold', sans-serif" fill="#F5F1EA" text-anchor="middle">
    <text x="100" y="92" font-size="84" letter-spacing="3">BJJ</text>
    <text x="100" y="160" font-size="46" letter-spacing="4">TUFF</text>
  </g>

  <!-- Wordmark below -->
  <g font-family="Anton, Impact, 'Arial Narrow Bold', 'Helvetica Condensed Bold', sans-serif" fill="#0A0A0A" text-anchor="middle">
