<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>BJJ TUFF — YouTube Channel Banner (16:9, 2048x1152)</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2048px; height: 1152px; background: #000; overflow: hidden; }
  .canvas {
    width: 2048px;
    height: 1152px;
    background: #000;
    background-image:
      radial-gradient(1100px 800px at 50% 50%, rgba(230, 57, 70, 0.18), transparent 70%),
      radial-gradient(800px 600px at 12% 22%, rgba(245, 241, 234, 0.04), transparent 70%),
      radial-gradient(800px 600px at 88% 78%, rgba(230, 57, 70, 0.10), transparent 70%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .canvas img {
    height: 540px;
    width: auto;
    display: block;
  }
</style>
</head>
<body>
<div class="canvas">
  <img src="../source/wordmark-transparent.png" alt="BJJ TUFF" />
</div>
</body>
</html>
