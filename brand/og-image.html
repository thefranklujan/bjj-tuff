<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>BJJ Tuff OG Image</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: #0A0A0A; overflow: hidden; }
  .canvas {
    width: 1200px;
    height: 630px;
    background: #0A0A0A;
    background-image:
      radial-gradient(800px 500px at 80% 30%, rgba(230, 57, 70, 0.10), transparent 65%),
      radial-gradient(500px 300px at 10% 80%, rgba(245, 241, 234, 0.04), transparent 65%);
    display: grid;
    grid-template-columns: 1fr 350px;
    align-items: center;
    padding: 80px;
    gap: 80px;
  }
  .left { display: flex; flex-direction: column; gap: 24px; align-items: flex-start; }
  .wordmark {
    font-family: "Anton", "Impact", "Arial Narrow Bold", sans-serif;
    color: #F5F1EA;
    font-size: 220px;
    line-height: 0.86;
    letter-spacing: -0.005em;
    text-transform: uppercase;
    font-weight: 400;
    position: relative;
    display: inline-block;
  }
  .wordmark .dot {
    position: absolute;
    bottom: 16px;
    right: -36px;
    width: 26px;
    height: 26px;
    background: #E63946;
  }
  .meta {
    font-family: "JetBrains Mono", "Menlo", monospace;
    font-size: 16px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(245, 241, 234, 0.6);
    margin-top: 8px;
  }
  .patch {
    width: 350px;
    height: 350px;
    background: #E63946;
    box-shadow: inset 0 0 0 4px rgba(0,0,0,0.06), 0 8px 0 rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #F5F1EA;
    font-family: "Anton", "Impact", "Arial Narrow Bold", sans-serif;
    text-transform: uppercase;
    line-height: 0.92;
    letter-spacing: 0.02em;
    font-weight: 400;
  }
  .patch .top { font-size: 150px; }
  .patch .bottom { font-size: 84px; margin-top: 12px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="left">
    <div class="wordmark">BJJ<br/>TUFF<span class="dot"></span></div>
    <div class="meta">SOLO BJJ FITNESS · FREE ON YOUTUBE</div>
  </div>
  <div class="patch">
    <div class="top">BJJ</div>
    <div class="bottom">TUFF</div>
  </div>
</div>
</body>
</html>
