<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>BJJ Tuff OG Image</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: #0A0A0A; overflow: hidden; }
  .canvas {
    width: 1200px;
    height: 630px;
    background: #0A0A0A;
    background-image:
      radial-gradient(800px 500px at 80% 30%, rgba(230, 57, 70, 0.10), transparent 65%),
      radial-gradient(500px 300px at 10% 80%, rgba(245, 241, 234, 0.04), transparent 65%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px 100px;
    gap: 32px;
  }
  .wordmark {
    font-family: "Anton", "Impact", "Arial Narrow Bold", sans-serif;
    font-size: 220px;
    line-height: 0.86;
    letter-spacing: -0.005em;
    text-transform: uppercase;
    font-weight: 400;
    position: relative;
    display: inline-block;
  }
  .wordmark .bjj { color: #F5F1EA; }
  .wordmark .tuff { color: #E63946; }
  .wordmark .dot {
    display: inline-block;
    width: 28px;
    height: 28px;
    background: #E63946;
    margin-left: 14px;
    vertical-align: baseline;
    transform: translateY(-6px);
  }
  .meta {
    font-family: "JetBrains Mono", "Menlo", monospace;
    font-size: 18px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(245, 241, 234, 0.6);
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="wordmark"><span class="bjj">BJJ</span> <span class="tuff">TUFF</span><span class="dot"></span></div>
  <div class="meta">SOLO BJJ FITNESS · FREE ON YOUTUBE · SOFIA · OLIVIA · ARIANA</div>
</div>
</body>
</html>
